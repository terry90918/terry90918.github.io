when:
  - event: pull_request
    branch: main
  - event: push
    branch: main
  - event: manual

steps:
  validate:
    image: node:22-bookworm-slim
    commands:
      - npm install --global bun@1.3.14
      - bun install --frozen-lockfile
      - bun lint
      - bun run test
      - bunx @fission-ai/openspec validate --specs
      - bun run build
      - bun typecheck
